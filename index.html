<!doctype html>
<html lang="en">
<head>

<title>Hello Kitty to the Rescue</title>
<style>
:root{--p:#ff72b5;--h:#ff3e7d;--c:#fffaf5;--i:#2f2038;--g:#ffd86b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,sans-serif;background:#07091b;color:#fff}button{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 70% 8%,#36549b 0,#17204c 30%,#07091b 72%);overflow:hidden}.screen{min-height:100vh;display:grid;place-items:center;padding:18px}.panel,.mission{width:min(1080px,96vw)}.panel{padding:clamp(25px,5vw,56px);border-radius:32px;text-align:center;background:#080d24e8;border:1px solid #ffffff24;box-shadow:0 30px 90px #0009}.k{letter-spacing:.18em;color:#ffc6df;font-size:.75rem;font-weight:900;text-transform:uppercase}.title{font-size:clamp(2.7rem,8vw,6rem);line-height:.93;margin:12px 0}.title span{color:var(--p)}.lead{max-width:760px;margin:0 auto;color:#ffffffd6;line-height:1.7}.cta,.choice{border:0;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer}.cta{color:#fff;background:linear-gradient(135deg,var(--p),var(--h));box-shadow:0 12px 30px #ff3e7d44}.choice{width:100%;text-align:left;background:#fff;color:#392942;border:2px solid #efc4d8}.choice:hover{transform:translateY(-2px);border-color:var(--p)}.choice.correct{background:#ddf8e7;border-color:#58c883}.choice.wrong{background:#ffe1e7;border-color:#ed7087}.duo{display:flex;align-items:end;justify-content:center;gap:30px;margin:30px 0}.char{width:165px;height:210px;filter:drop-shadow(0 18px 18px #0008)}.char svg{width:100%;height:100%;overflow:visible}.sound{position:fixed;right:16px;top:16px;z-index:500;width:50px;height:50px;border-radius:50%;border:1px solid #ffffff30;background:#0a1028df;color:#fff;font-size:1.25rem;cursor:pointer}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff20}.progress{height:10px;background:#ffffff15;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--g))}.stage{position:relative;min-height:650px;border-radius:30px;overflow:hidden;border:1px solid #ffffff22;box-shadow:0 28px 90px #0009}.world{position:absolute;inset:0;z-index:1;background:linear-gradient(#274680 0 58%,#121a32 58%)}.world.park{background:linear-gradient(#6a4b78 0 54%,#293d39 54%)}.world.call{background:linear-gradient(#173b61 0 55%,#192238 55%)}.world.rooftop{background:linear-gradient(#294683 0 62%,#111626 62%)}.moon{position:absolute;width:130px;height:130px;border-radius:50%;right:8%;top:8%;background:#fff1b2;box-shadow:0 0 70px #fff1b266}.cloud{position:absolute;width:175px;height:44px;border-radius:999px;background:#ffffff20;animation:cloud 16s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:68px;height:68px;left:25px;top:-28px}.cloud:after{width:78px;height:78px;right:24px;top:-34px}@keyframes cloud{from{transform:translateX(-250px)}to{transform:translateX(1250px)}}.buildings{position:absolute;left:0;right:0;bottom:95px;height:290px;background:repeating-linear-gradient(90deg,#0d1631 0 90px,#18264a 90px 155px,#101b38 155px 250px);opacity:.95}.tree{position:absolute;bottom:92px;width:105px;height:245px;background:#17291f;border-radius:60% 60% 8px 8px}.road{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#293452,#111829);border-top:3px solid #ffffff18}.road:after{content:"";position:absolute;left:0;right:0;top:46px;height:5px;background:repeating-linear-gradient(90deg,#fff8 0 42px,transparent 42px 85px);animation:road 1s linear infinite}@keyframes road{to{background-position:-170px 0}}.chars{position:absolute;z-index:3;left:4%;right:4%;bottom:74px;display:flex;justify-content:space-between;align-items:end}.distance{position:absolute;z-index:2;left:20%;right:20%;bottom:170px;height:8px;border-radius:99px;background:#ffffff22}.distance i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--g))}.ui{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:22px;pointer-events:none}.card{pointer-events:auto;width:min(720px,92%);padding:26px;border-radius:28px;background:#fffaf5;color:var(--i);box-shadow:0 28px 75px #000b;text-align:center}.card h2{font-size:clamp(1.45rem,3vw,2.15rem);margin:10px 0 20px}.choices{display:grid;gap:11px}.story{font-size:clamp(1.15rem,3vw,1.8rem);min-height:110px;display:grid;place-items:center;line-height:1.55}.boss{background:#160d26;color:#fff;border:2px solid var(--p)}.boss h2{color:#ffacd1}.bossmeter{height:15px;margin:14px 0;border-radius:99px;background:#ffffff20;overflow:hidden}.bossmeter i{display:block;height:100%;background:linear-gradient(90deg,var(--h),var(--g))}.overlay{position:absolute;inset:0;z-index:150;display:grid;place-items:center;padding:22px;background:#080b1ab8}.travel-title{position:absolute;z-index:5;top:10%;left:50%;transform:translateX(-50%);font-size:clamp(1.5rem,4vw,2.7rem);font-weight:900;text-shadow:0 5px 20px #000;text-align:center}.runner{position:absolute;z-index:5;left:-220px;bottom:72px}.runner .char{animation:b .28s ease-in-out infinite alternate}@keyframes b{to{transform:translateY(-16px) rotate(4deg)}}.finale{position:relative;min-height:740px;border-radius:30px;overflow:hidden;box-shadow:0 28px 90px #0009}.hero{position:absolute;bottom:94px;width:180px;z-index:8}.hero.kitty{left:8%}.hero.spidey{right:8%}.websvg{position:absolute;inset:0;z-index:7;width:100%;height:100%;pointer-events:none}.webpath{stroke:#fff;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 5px #fff);stroke-dasharray:1000;stroke-dashoffset:1000}.heart{position:absolute;z-index:12;left:50%;bottom:315px;font-size:72px;opacity:0;transform:translateX(-50%) scale(.2)}.caption{position:absolute;z-index:12;top:7%;left:50%;transform:translateX(-50%);font-size:clamp(1.3rem,3vw,2.1rem);font-weight:900;text-align:center}.letterbtn{position:absolute;z-index:14;left:50%;bottom:20px;transform:translateX(-50%);opacity:0;pointer-events:none}.letterbtn.show{opacity:1;pointer-events:auto}.hidden{display:none!important}@media(max-width:700px){.char{width:115px;height:150px}.stage{min-height:690px}.card{width:95%;padding:19px}.chars{bottom:70px}.distance{left:25%;right:25%;bottom:145px}.finale{min-height:700px}.hero{width:122px;bottom:95px}.hero.kitty{left:2%}.hero.spidey{right:2%}.heart{bottom:260px}}
</style>
</head>
<body><div id="root"></div><button class="sound" id="sound">🔊</button>
<script>
(()=>{'use strict';
const root=document.getElementById('root'),S={q:0,l:3,c:0,score:0,lock:false,sound:true,a:null,m:false,mt:null};
const Q=[
{scene:'city',q:'Hum pehli baar December mein kis date ko mile the?',o:['24 December','25 December','26 December','28 December'],a:2,date:'26 December 2022',title:'Jab hum pehli baar mile',detail:'Wahi din jab ek normal si meeting ne hamari story ka pehla page likh diya.'},
{scene:'city',q:'Hamari story mein sabse pehle kya hua tha?',o:['Humne numbers exchange kiye','Hamari pehli call hui','Hum pehli baar mile','Hum officially date karne lage'],a:2,date:'26 December 2022',title:'Yahin se sab shuru hua',detail:'Sabse pehle hum mile the. Baaki saare chapters uske baad aaye.'},
{scene:'call',q:'Humne March mein kis date ko numbers exchange kiye the?',o:['3 March','5 March','6 March','8 March'],a:1,date:'5 March 2023',title:'Finally, tera number mil gaya',detail:'Ussi din humne numbers exchange kiye aur story thodi aur real ho gayi.'},
{scene:'call',q:'Hamari pehli phone call kis month mein hui thi?',o:['August','September','October','November'],a:1,date:'8 September 2023',title:'Hamari pehli call',detail:'Aur woh bhi koi seedhi-saadhi call nahi thi—tu aur didi milkar mujhe prank kar rahe the 💀'},
{scene:'call',q:'Pehli phone call mein tu aur didi kya kar rahe the?',o:['Birthday plan bana rahe the','Mujhe lecture de rahe the','Ek ladki bankar prank kar rahe the','Gaana record kar rahe the'],a:2,date:'8 September 2023',title:'Woh legendary prank call',detail:'Tune aur didi ne ek imaginary ladki bana di aur main genuinely confuse ho gaya tha.'},
{scene:'rooftop',q:'Hum officially dating December mein kis date ko start hue?',o:['11 December','12 December','13 December','14 December'],a:2,date:'13 December 2024',title:'Jis din hum “hum” bane',detail:'Iss din maine tujhe propose kiya aur hum officially dating start hue.'},
{scene:'rooftop',q:'Hamari timeline ka sahi order kaunsa hai?',o:['Pehli call → numbers → dating','Numbers → pehli meeting → dating','Pehli meeting → numbers → pehli call → dating','Dating → pehli call → numbers'],a:2,date:'Hamari timeline',title:'Tune poori timeline jod di',detail:'Pehle hum mile, phir numbers exchange hue, phir prank call, aur phir officially hum.'},
{scene:'park',q:'Deer Park wali misunderstanding mein tune exactly kya bola tha?',o:['Should I?','Shirt','Sure?','Shh'],a:1,date:'23 May 2025 · Deer Park',title:'“Shirt?”',detail:'Tune “shirt” bola, mujhe “should I?” sunayi diya, aur main “Are you sure?” bolkar khud hi phas gaya 💀'},
{scene:'park',q:'Deer Park wale moment ke baad countdown kya tha?',o:['5… 4… 3… GO','3… 2… 1… GO','1… 2… 3… GO','Ready… set… GO'],a:1,date:'23 May 2025',title:'3… 2… 1… GO ❤️',detail:'Thodi embarrassment ke baad bhi tune uss moment ko legendary bana diya.'},
{scene:'park',q:'Mujhe tease karne ke liye tune kaunsa gaana bheja tha?',o:['Lag Ja Gale','Pehla Nasha','Buddha Mil Gaya','Pal Pal Dil Ke Paas'],a:2,date:'Hamari teasing anthem',title:'“Mujhe Buddha Mil Gaya”',detail:'Sirf isliye kyunki main kabhi-kabhi zyada mature act karta hoon. Accha ji, itna bhi buddha nahi hoon 😭'}];
const intro=['Ek shaant raat thi. Hello Kitty apni birthday walk par nikli thi… 🎀','Tabhi aasman se ek tooti hui spider-web uske paas aa kar giri.','Memory Monster ne Spider-Man ko pakad liya tha aur hamari yaadon ko 10 crystals mein tod diya tha.','“Pihu! Agar yaadein wapas nahi aayi, toh meri web toot jayegi…”','Ab sirf tu hi har memory wapas laa kar Spider-Man ko bacha sakti hai.','Das yaadein. Teen hearts. Aur ek hero jo sirf tera wait kar raha hai. 💗'];
const wrong=['Areee Pihu… web aur slip ho gayi 😭','Mujhe laga tujhe yeh yaad hoga… koi nahi, ek aur try kar 🥺','Main gir raha hoon, par mujhe abhi bhi tujh par trust hai ❤️','Memory Monster aur strong ho raha hai… jaldi kar!','Nooo, yeh meri favourite memories mein se ek thi 😭'];
function kitty(bl=false){return `<div class="char"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="194" rx="47" ry="16" fill="#0003"/><path d="M54 56 38 22 72 42M126 56l16-34-34 20" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="90" cy="78" rx="59" ry="51" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="70" cy="77" rx="5" ry="8"/><ellipse cx="112" cy="77" rx="5" ry="8"/><ellipse cx="91" cy="91" rx="7" ry="5" fill="#ffd54d"/>${bl?'<ellipse cx="57" cy="98" rx="12" ry="6" fill="#ff8cab"/><ellipse cx="123" cy="98" rx="12" ry="6" fill="#ff8cab"/>':''}<path d="M78 105q13 12 27 0" fill="none" stroke="#2b2130" stroke-width="4"/><path d="M126 47c11-15 27-10 27 3 0 12-14 17-27 8-13 9-27 4-27-8 0-13 16-18 27-3Z" fill="#ff6faa" stroke="#2b2130" stroke-width="4"/><path d="M59 125q31-17 62 0l12 60H47z" fill="#ff78b7" stroke="#2b2130" stroke-width="5"/><path d="M57 139 28 164M123 139l29 25M69 184l-8 25M111 184l8 25" stroke="#2b2130" stroke-width="7" stroke-linecap="round"/></svg></div>`}
function spidey(bl=false){return `<div class="char"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="201" rx="42" ry="13" fill="#0003"/><ellipse cx="90" cy="61" rx="39" ry="43" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M63 51q12-13 20 4-9 31-25 8Zm54 0q-12-13-20 4 9 31 25 8Z" fill="#fff" stroke="#181521" stroke-width="4"/>${bl?'<ellipse cx="55" cy="82" rx="11" ry="6" fill="#ff9ab6"/><ellipse cx="125" cy="82" rx="11" ry="6" fill="#ff9ab6"/>':''}<path d="M90 19v83M54 41l72 42M126 41 54 83M51 62h78" stroke="#181521" stroke-width="2"/><path d="M61 103q29-18 58 0l15 68-29 20H75l-29-20z" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M61 111 43 174M119 111l18 63M72 181l-9 29M108 181l9 29" stroke="#173c78" stroke-width="18" stroke-linecap="round"/></svg></div>`}
function world(sc){return `<div class="world ${sc}"><div class="moon"></div><div class="cloud" style="top:18%"></div><div class="cloud" style="top:34%;animation-delay:-8s;opacity:.55"></div>${sc==='park'?'<div class="tree" style="left:5%"></div><div class="tree" style="right:6%;height:275px"></div>':'<div class="buildings"></div>'}<div class="road"></div></div>`}
function tone(f,d=.15,t='sine',g=.045){if(!S.sound)return;try{const A=window.AudioContext||window.webkitAudioContext,c=S.a||(S.a=new A()),o=c.createOscillator(),v=c.createGain();o.type=t;o.frequency.value=f;v.gain.setValueAtTime(g,c.currentTime);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}
function sfx(k){if(k==='ok')[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*100));else if(k==='bad'){tone(220,.22,'sawtooth');setTimeout(()=>tone(155,.35,'sawtooth'),150)}else [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*90))}
function music(){if(!S.sound||S.m)return;S.m=true;let i=0,a=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];S.mt=setInterval(()=>tone(a[i++%a.length],.55,'sine',.018),520)}
sound.onclick=()=>{S.sound=!S.sound;sound.textContent=S.sound?'🔊':'🔇';if(S.sound)music();else{clearInterval(S.mt);S.m=false}};
function introPage(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="k">Pihu turns 20</p><h1 class="title"><span>Hello Kitty</span><br>to the Rescue</h1><p class="lead">Spider-Man phas gaya hai, yaadein bikhar gayi hain… aur ab usse bachane sirf tu aa sakti hai.</p><div class="duo">${kitty()}<div style="font-size:48px">💗</div>${spidey()}</div><button class="cta" id="begin">Kahani shuru kar 🎀</button></div></section></main>`;begin.onclick=()=>{music();cut(0)}}
function cut(i){if(i>=intro.length)return brief();root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="stage">${world('rooftop')}<div class="ui"><div class="card"><p class="k">Kahani</p><div class="story">${intro[i]}</div><button class="cta" id="cont">${i===intro.length-1?'Mission accept kar':'Aage dekh'}</button></div></div></div></div></section></main>`;cont.onclick=()=>cut(i+1)}
function brief(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="k">Tera mission</p><h1>Saari 10 yaadein wapas laa</h1><p class="lead">Har sahi jawab tujhe Spider-Man ke aur paas le jayega. Galat jawab par ek heart chala jayega—but tu try karti reh sakti hai.</p><div style="font-size:2rem;margin:25px 0">💎 × 10 &nbsp; ❤️ × 3</div><button class="cta" id="go">Chal, usse bachate hain</button></div></section></main>`;go.onclick=travel}
function travel(){let x=Q[S.q];root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>Yaad ${S.q+1}/10 tak pahunch rahi hai…</span><span>💎 ${S.c}/10 · ${'❤️'.repeat(S.l)}</span></div><div class="stage">${world(x.scene)}<div class="travel-title">${S.q>=7?'Memory Monster ke paas pahunch gayi… 👾':'Jaldi kar Pihu! 🎀'}</div><div class="runner" id="run">${kitty()}</div></div></div></section></main>`;run.animate([{transform:'translateX(0)'},{transform:'translateX(48vw) translateY(-18px)'},{transform:'translateX(calc(100vw + 260px))'}],{duration:3000,easing:'linear'});setTimeout(game,3050)}
function game(){S.lock=false;let x=Q[S.q],boss=S.q>=7;root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>${boss?'Aakhri chunauti':'Yaad'} ${S.q+1}/10 · Score ${S.score}</span><span>💎 ${S.c}/10 · ${'❤️'.repeat(S.l)}${'🖤'.repeat(3-S.l)}</span></div><div class="progress"><i style="width:${S.q*10}%"></i></div><div class="stage" id="stage">${world(x.scene)}<div class="chars"><div>${kitty()}</div><div>${spidey()}</div></div><div class="distance"><i style="width:${10+S.q*9}%"></i></div><div class="ui"><div class="card ${boss?'boss':''}"><p class="k">${boss?'Memory Monster ki challenge 👾':'Yaad kar'}</p><h2>${x.q}</h2>${boss?`<div class="bossmeter"><i style="width:${100-(S.q-7)*33}%"></i></div>`:''}<div class="choices">${x.o.map((v,i)=>`<button class="choice" data-i="${i}">${v}</button>`).join('')}</div></div></div></div></div></section></main>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function answer(i,b){if(S.lock)return;S.lock=true;let x=Q[S.q];if(i===x.a){b.classList.add('correct');S.c++;S.score+=100+(S.q>=7?75:0);sfx('ok');setTimeout(()=>memory(x),650)}else{b.classList.add('wrong');S.l--;sfx('bad');let e=document.createElement('div');e.className='overlay';e.innerHTML=`<div class="card"><h2>Yaad thodi blur ho gayi 💔</h2><p>${wrong[S.q%wrong.length]}</p><button class="cta" id="retry">Ek aur try kar</button></div>`;stage.appendChild(e);if(S.l<=0){S.l=3;S.score=Math.max(0,S.score-150)};retry.onclick=travel}}
function memory(x){let e=document.createElement('div');e.className='overlay';e.innerHTML=`<div class="card"><div style="font-size:3rem">💎✨</div><p class="k">Yaad wapas aa gayi</p><h2>${x.title}</h2><p><b>${x.date}</b></p><p>${x.detail}</p><button class="cta" id="next">${S.q===9?'Ab usse bacha le':'Agli yaad ke paas chal'}</button></div>`;stage.appendChild(e);next.onclick=()=>{S.q++;S.q>=10?finale():travel()}}
function finale(){root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="finale" id="fin">${world('rooftop')}<div class="caption">Tune saari yaadein wapas laa di 💗</div><svg class="websvg" viewBox="0 0 1000 700" preserveAspectRatio="none"><path id="web" class="webpath" d="M820 390 L170 505"/></svg><div class="hero kitty" id="fk">${kitty(true)}</div><div class="hero spidey" id="fs">${spidey(true)}</div><div class="heart" id="heart">💗</div><button class="cta letterbtn" id="letter">Apna birthday letter khol 💌</button><div class="overlay hidden" id="ov"><div class="card"><p class="k">Mission complete</p><h2>Tune Spider-Man ko bacha liya 💗</h2><p>Tune har yaad wapas laayi, Memory Monster ko hara diya, aur har jagah se hote hue aakhir mere paas aa hi gayi.</p><p>Happy birthday, Pihu. Yeh chhoti si duniya sirf tere liye banayi hai.</p><button class="cta" id="again">Phir se khel</button></div></div></div></div></section></main>`;
let w=web,k=fk,s=fs,h=heart,m=innerWidth<700;setTimeout(()=>w.animate([{strokeDashoffset:1000},{strokeDashoffset:0}],{duration:850,fill:'forwards'}),400);setTimeout(()=>k.animate([{left:m?'2%':'8%'},{left:m?'45%':'50%'}],{duration:1450,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'}),1100);setTimeout(()=>{w.animate([{opacity:1},{opacity:0}],{duration:350,fill:'forwards'});s.animate([{right:m?'2%':'8%'},{right:m?'37%':'36%',transform:'rotate(-5deg)'}],{duration:600,fill:'forwards'});k.animate([{transform:'rotate(0)'},{transform:'rotate(5deg)'}],{duration:600,fill:'forwards'})},2750);setTimeout(()=>{h.animate([{opacity:0,transform:'translateX(-50%) scale(.2)'},{opacity:1,transform:'translateX(-50%) scale(1.5)'},{opacity:0,transform:'translateX(-50%) translateY(-95px) scale(.7)'}],{duration:1450,fill:'forwards'});sfx('kiss')},3400);setTimeout(()=>{k.animate([{transform:'rotate(5deg)'},{transform:'translateX(20px) rotate(2deg)'}],{duration:600,fill:'forwards'});s.animate([{transform:'rotate(-5deg)'},{transform:'translateX(-20px) rotate(-2deg)'}],{duration:600,fill:'forwards'});confetti()},4300);setTimeout(()=>letter.classList.add('show'),5400);letter.onclick=()=>ov.classList.remove('hidden');again.onclick=()=>{Object.assign(S,{q:0,l:3,c:0,score:0,lock:false});introPage()}}
function confetti(){for(let i=0;i<140;i++){let p=document.createElement('div');p.textContent=['💗','🎀','✨','🌸','❤️'][i%5];Object.assign(p.style,{position:'fixed',left:Math.random()*100+'vw',top:'-50px',zIndex:999,fontSize:(15+Math.random()*22)+'px',pointerEvents:'none'});document.body.appendChild(p);p.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY(112vh) rotate(900deg)'}],{duration:3200+Math.random()*2800,delay:Math.random()*1200,easing:'linear'});setTimeout(()=>p.remove(),7200)}}
introPage();
})();
</script></body></html>
