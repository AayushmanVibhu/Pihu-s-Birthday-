<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Kitty to the Rescue</title>
<style>
:root{--pink:#ff72b5;--hot:#ff3e7d;--cream:#fffaf5;--ink:#2f2038;--night:#07091b;--gold:#ffd86b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,sans-serif;background:var(--night);color:#fff}button{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 70% 8%,#36549b 0,#17204c 30%,#07091b 72%);overflow:hidden}.screen{min-height:100vh;display:grid;place-items:center;padding:18px}.panel,.mission{width:min(1080px,96vw)}.panel{padding:clamp(25px,5vw,56px);border-radius:32px;text-align:center;background:#080d24e8;border:1px solid #ffffff24;box-shadow:0 30px 90px #0009}.kicker{text-transform:uppercase;letter-spacing:.18em;color:#ffc6df;font-size:.75rem;font-weight:900}.title{font-size:clamp(2.7rem,8vw,6rem);line-height:.93;margin:12px 0}.title span{color:var(--pink)}.lead{max-width:730px;margin:0 auto;color:#ffffffd6;line-height:1.7}.cta,.choice{border:0;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer}.cta{color:#fff;background:linear-gradient(135deg,var(--pink),var(--hot));box-shadow:0 12px 30px #ff3e7d44}.choice{width:100%;text-align:left;background:#fff;color:#392942;border:2px solid #efc4d8;transition:.2s}.choice:hover{transform:translateY(-2px);border-color:var(--pink)}.choice.correct{background:#ddf8e7;border-color:#58c883}.choice.wrong{background:#ffe1e7;border-color:#ed7087}.duo{display:flex;align-items:end;justify-content:center;gap:30px;margin:30px 0}.character{width:165px;height:210px;filter:drop-shadow(0 18px 18px #0008)}.character svg{width:100%;height:100%;overflow:visible}.sound{position:fixed;right:16px;top:16px;z-index:500;width:50px;height:50px;border-radius:50%;border:1px solid #ffffff30;background:#0a1028df;color:#fff;font-size:1.25rem;cursor:pointer}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff20}.progress{height:10px;background:#ffffff15;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:.4s}.game-stage{position:relative;min-height:650px;border-radius:30px;overflow:hidden;border:1px solid #ffffff22;box-shadow:0 28px 90px #0009}.world{position:absolute;inset:0;z-index:1;background:linear-gradient(#274680 0 58%,#121a32 58%)}.world.park{background:linear-gradient(#6a4b78 0 54%,#293d39 54%)}.world.call{background:linear-gradient(#173b61 0 55%,#192238 55%)}.world.rooftop{background:linear-gradient(#294683 0 62%,#111626 62%)}.moon{position:absolute;width:130px;height:130px;border-radius:50%;right:8%;top:8%;background:#fff1b2;box-shadow:0 0 70px #fff1b266}.cloud{position:absolute;width:175px;height:44px;border-radius:999px;background:#ffffff20;animation:cloud 16s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:68px;height:68px;left:25px;top:-28px}.cloud:after{width:78px;height:78px;right:24px;top:-34px}@keyframes cloud{from{transform:translateX(-250px)}to{transform:translateX(1250px)}}.buildings{position:absolute;left:0;right:0;bottom:95px;height:290px;background:repeating-linear-gradient(90deg,#0d1631 0 90px,#18264a 90px 155px,#101b38 155px 250px);opacity:.95}.buildings:after{content:"";position:absolute;inset:25px 10px 20px;background:repeating-linear-gradient(90deg,transparent 0 22px,#ffd86b55 22px 30px,transparent 30px 55px),repeating-linear-gradient(0deg,transparent 0 34px,#ffd86b44 34px 42px,transparent 42px 65px)}.tree{position:absolute;bottom:92px;width:105px;height:245px;background:#17291f;border-radius:60% 60% 8px 8px}.road{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#293452,#111829);border-top:3px solid #ffffff18}.road:after{content:"";position:absolute;left:0;right:0;top:46px;height:5px;background:repeating-linear-gradient(90deg,#fff8 0 42px,transparent 42px 85px);animation:road 1s linear infinite}@keyframes road{to{background-position:-170px 0}}.characters{position:absolute;z-index:3;left:4%;right:4%;bottom:74px;display:flex;justify-content:space-between;align-items:end}.distance{position:absolute;z-index:2;left:20%;right:20%;bottom:170px;height:8px;border-radius:99px;background:#ffffff22}.distance i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--gold))}.ui-layer{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:22px;pointer-events:none}.card{pointer-events:auto;width:min(720px,92%);padding:26px;border-radius:28px;background:#fffaf5;color:var(--ink);box-shadow:0 28px 75px #000b;text-align:center}.card h2{font-size:clamp(1.45rem,3vw,2.15rem);margin:10px 0 20px}.choices{display:grid;gap:11px}.story-line{font-size:clamp(1.15rem,3vw,1.8rem);min-height:110px;display:grid;place-items:center;line-height:1.55}.memory-card p,.story-card p{line-height:1.7;color:#625469}.boss-card{background:#160d26;color:#fff;border:2px solid var(--pink)}.boss-card h2{color:#ffacd1}.boss-meter{height:15px;margin:14px 0;border-radius:99px;background:#ffffff20;overflow:hidden}.boss-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}.emotional{position:absolute;inset:0;z-index:150;display:grid;place-items:center;padding:22px;background:#080b1ab8}.travel-title{position:absolute;z-index:5;top:10%;left:50%;transform:translateX(-50%);font-size:clamp(1.5rem,4vw,2.7rem);font-weight:900;text-shadow:0 5px 20px #000;text-align:center}.runner{position:absolute;z-index:5;left:-220px;bottom:72px}.runner .character{animation:runBounce .28s ease-in-out infinite alternate}@keyframes runBounce{to{transform:translateY(-16px) rotate(4deg)}}.finale{position:relative;min-height:740px;border-radius:30px;overflow:hidden;box-shadow:0 28px 90px #0009}.finale .world{z-index:1}.finale .hero{position:absolute;bottom:94px;width:180px;z-index:8}.finale .kitty{left:8%}.finale .spidey{right:8%}.web-svg{position:absolute;inset:0;z-index:7;width:100%;height:100%;pointer-events:none}.web-path{stroke:#fff;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 5px #fff);stroke-dasharray:1000;stroke-dashoffset:1000}.finale .heart{position:absolute;z-index:12;left:50%;bottom:315px;font-size:72px;opacity:0;transform:translateX(-50%) scale(.2)}.finale .caption{position:absolute;z-index:12;top:7%;left:50%;transform:translateX(-50%);font-size:clamp(1.3rem,3vw,2.1rem);font-weight:900;text-align:center}.letterBtn{position:absolute;z-index:14;left:50%;bottom:20px;transform:translateX(-50%);opacity:0;pointer-events:none}.letterBtn.show{opacity:1;pointer-events:auto}.overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:#050716e8}.hidden{display:none!important}.letter{width:min(720px,94%);padding:30px;border-radius:24px;background:#fffaf1;color:#35263d;box-shadow:0 30px 90px #0009}.letter p{line-height:1.8;color:#66556c}@media(max-width:700px){.character{width:115px;height:150px}.game-stage{min-height:690px}.card{width:95%;padding:19px}.characters{bottom:70px}.distance{left:25%;right:25%;bottom:145px}.finale{min-height:700px}.finale .hero{width:122px;bottom:95px}.finale .kitty{left:2%}.finale .spidey{right:2%}.finale .heart{bottom:260px}}
</style>
</head>
<body><div id="root"></div><button class="sound" id="soundBtn">🔊</button>
<script>
(()=>{'use strict';
const root=document.getElementById('root');
const state={q:0,lives:3,crystals:0,score:0,locked:false,sound:true,music:false,audio:null,musicTimer:null};
const questions=[
{scene:'city',q:'Hum pehli baar December mein kis date ko mile the?',o:['24 December','25 December','26 December','28 December'],a:2,date:'26 December 2022',title:'The first meeting',detail:'Wahi din jab ek normal si meeting ne hamari story ka pehla page likha.'},
{scene:'city',q:'Hamari story ka sabse pehla milestone kaunsa tha?',o:['Numbers exchange karna','Pehli phone call','Pehli baar milna','Officially dating start karna'],a:2,date:'26 December 2022',title:'Chapter one',detail:'Sabse pehle hum mile. Baaki saare chapters uske baad aaye.'},
{scene:'call',q:'Humne March mein kis date ko numbers exchange kiye the?',o:['3 March','5 March','6 March','8 March'],a:1,date:'5 March 2023',title:'Finally, number mil gaya',detail:'Ussi din humne numbers exchange kiye aur story thodi aur real ho gayi.'},
{scene:'call',q:'Hamari pehli phone call kis month mein hui thi?',o:['August','September','October','November'],a:1,date:'8 September 2023',title:'The first call',detail:'Aur woh bhi ek seedhi-saadhi call nahi thi—tum aur didi prank kar rahe the 💀'},
{scene:'call',q:'Pehli phone call mein tum aur didi kya kar rahe the?',o:['Birthday plan bana rahe the','Mujhe lecture de rahe the','Ek ladki bankar prank kar rahe the','Gaana record kar rahe the'],a:2,date:'8 September 2023',title:'The prank call',detail:'Tum dono ne ek imaginary ladki bana di, aur main genuinely confuse ho gaya tha.'},
{scene:'rooftop',q:'Hum officially dating December mein kis date ko start hue?',o:['11 December','12 December','13 December','14 December'],a:2,date:'13 December 2024',title:'The day we became us',detail:'Iss din maine tumhe propose kiya aur hum officially dating start hue.'},
{scene:'rooftop',q:'Hamari timeline ka sahi order kaunsa hai?',o:['First call → numbers → dating','Numbers → first meeting → dating','First meeting → numbers → first call → dating','Dating → first call → numbers'],a:2,date:'Our timeline',title:'Memory sequence restored',detail:'First meeting, phir numbers, phir prank call, aur phir officially us.'},
{scene:'park',q:'Deer Park wali misunderstanding mein tumne exactly kya bola tha?',o:['Should I?','Shirt','Sure?','Shh'],a:1,date:'23 May 2025 · Deer Park',title:'“Shirt?”',detail:'Tumne “shirt” bola, mujhe “should I?” sunayi diya, aur main “Are you sure?” bolkar khud hi phas gaya 💀'},
{scene:'park',q:'Deer Park moment ke baad countdown kaunsa tha?',o:['5… 4… 3… GO','3… 2… 1… GO','1… 2… 3… GO','Ready… set… GO'],a:1,date:'23 May 2025',title:'3… 2… 1… GO ❤️',detail:'Embarrassment ke baad bhi moment eventually legendary ban gaya.'},
{scene:'park',q:'Mujhe tease karne ke liye tumne kaunsa gaana bheja tha?',o:['Lag Ja Gale','Pehla Nasha','Buddha Mil Gaya','Pal Pal Dil Ke Paas'],a:2,date:'The teasing anthem',title:'“Mujhe Buddha Mil Gaya”',detail:'Sirf isliye kyunki main kabhi-kabhi zyada mature act karta hoon. Accha ji, itna bhi buddha nahi hoon 😭'}];
const introLines=['Ek shaant raat thi. Hello Kitty apni birthday walk par nikli thi… 🎀','Tabhi aasman se ek tooti hui spider-web uske paas aa kar giri.','Memory Monster ne Spider-Man ko capture kar liya tha aur yaadon ko 10 crystals mein tod diya tha.','“Pihu! Agar memories wapas nahi aayi, toh meri web toot jayegi…”','Ab sirf birthday girl hi har memory recover karke Spider-Man ko bacha sakti hai.','Das memories. Teen hearts. Aur ek hero jo tumhara wait kar raha hai. 💗'];
const wrongLines=['Areee Pihu… web aur slip ho gayi 😭','Yeh memory blur ho rahi hai… please ek aur try 🥺','Main gir raha hoon, par mujhe abhi bhi tum par trust hai ❤️','Memory Monster strong ho raha hai… jaldi!','Nooo, yeh meri favourite memories mein se ek thi 😭'];
function kitty(blush=false){return `<div class="character"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="194" rx="47" ry="16" fill="#0003"/><path d="M54 56 38 22 72 42M126 56l16-34-34 20" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="90" cy="78" rx="59" ry="51" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="70" cy="77" rx="5" ry="8"/><ellipse cx="112" cy="77" rx="5" ry="8"/><ellipse cx="91" cy="91" rx="7" ry="5" fill="#ffd54d"/>${blush?'<ellipse cx="57" cy="98" rx="12" ry="6" fill="#ff8cab"/><ellipse cx="123" cy="98" rx="12" ry="6" fill="#ff8cab"/>':''}<path d="M78 105q13 12 27 0" fill="none" stroke="#2b2130" stroke-width="4"/><path d="M126 47c11-15 27-10 27 3 0 12-14 17-27 8-13 9-27 4-27-8 0-13 16-18 27-3Z" fill="#ff6faa" stroke="#2b2130" stroke-width="4"/><path d="M59 125q31-17 62 0l12 60H47z" fill="#ff78b7" stroke="#2b2130" stroke-width="5"/><path d="M57 139 28 164M123 139l29 25M69 184l-8 25M111 184l8 25" stroke="#2b2130" stroke-width="7" stroke-linecap="round"/></svg></div>`}
function spidey(blush=false){return `<div class="character"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="201" rx="42" ry="13" fill="#0003"/><ellipse cx="90" cy="61" rx="39" ry="43" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M63 51q12-13 20 4-9 31-25 8Zm54 0q-12-13-20 4 9 31 25 8Z" fill="#fff" stroke="#181521" stroke-width="4"/>${blush?'<ellipse cx="55" cy="82" rx="11" ry="6" fill="#ff9ab6"/><ellipse cx="125" cy="82" rx="11" ry="6" fill="#ff9ab6"/>':''}<path d="M90 19v83M54 41l72 42M126 41 54 83M51 62h78" stroke="#181521" stroke-width="2"/><path d="M61 103q29-18 58 0l15 68-29 20H75l-29-20z" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M61 111 43 174M119 111l18 63M72 181l-9 29M108 181l9 29" stroke="#173c78" stroke-width="18" stroke-linecap="round"/></svg></div>`}
function world(scene){return `<div class="world ${scene}"><div class="moon"></div><div class="cloud" style="top:18%"></div><div class="cloud" style="top:34%;animation-delay:-8s;opacity:.55"></div>${scene==='park'?'<div class="tree" style="left:5%"></div><div class="tree" style="right:6%;height:275px"></div>':'<div class="buildings"></div>'}<div class="road"></div></div>`}
function tone(f,d=.15,type='sine',g=.045){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;const c=state.audio||(state.audio=new A());const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,c.currentTime);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}
function sfx(kind){if(kind==='ok')[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*100));else if(kind==='bad'){tone(220,.22,'sawtooth');setTimeout(()=>tone(155,.35,'sawtooth'),150)}else [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*90))}
function startMusic(){if(!state.sound||state.music)return;state.music=true;let step=0;const seq=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];state.musicTimer=setInterval(()=>tone(seq[step++%seq.length],.55,'sine',.018),520)}
function stopMusic(){clearInterval(state.musicTimer);state.musicTimer=null;state.music=false}document.getElementById('soundBtn').onclick=()=>{state.sound=!state.sound;document.getElementById('soundBtn').textContent=state.sound?'🔊':'🔇';state.sound?startMusic():stopMusic()};
function intro(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="kicker">Pihu turns 20</p><h1 class="title"><span>Hello Kitty</span><br>to the Rescue</h1><p class="lead">Somewhere in the city, ten memories are waiting to be found—and Spider-Man is running out of time.</p><div class="duo">${kitty()}<div style="font-size:48px">💗</div>${spidey()}</div><button class="cta" id="begin">Begin story 🎀</button></div></section></main>`;document.getElementById('begin').onclick=()=>{startMusic();cutscene(0)}}
function cutscene(i){if(i>=introLines.length)return brief();root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="game-stage">${world('rooftop')}<div class="ui-layer"><div class="card story-card"><p class="kicker">A birthday adventure</p><div class="story-line">${introLines[i]}</div><button class="cta" id="continue">${i===introLines.length-1?'Accept mission':'Continue'}</button></div></div></div></div></section></main>`;document.getElementById('continue').onclick=()=>cutscene(i+1)}
function brief(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="kicker">Your mission</p><h1>Bring every memory home</h1><p class="lead">Recover all ten crystals before the Memory Monster breaks Spider-Man’s last web. You have three hearts—but he believes you will make it.</p><div style="font-size:2rem;margin:25px 0">💎 × 10 &nbsp; ❤️ × 3</div><button class="cta" id="go">Start mission</button></div></section></main>`;document.getElementById('go').onclick=travel}
function travel(){const x=questions[state.q];root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>Memory ${state.q+1}/10</span><span>💎 ${state.crystals}/10 · ${'❤️'.repeat(state.lives)}</span></div><div class="game-stage">${world(x.scene)}<div class="travel-title">${state.q>=7?'The Memory Monster is close… 👾':'Run Pihu, run! 🎀'}</div><div class="runner" id="runner">${kitty()}</div></div></div></section></main>`;document.getElementById('runner').animate([{transform:'translateX(0)'},{transform:'translateX(48vw) translateY(-18px)'},{transform:'translateX(calc(100vw + 260px))'}],{duration:2800,easing:'linear'});setTimeout(game,2850)}
function game(){state.locked=false;const x=questions[state.q],boss=state.q>=7;root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>${boss?'MEMORY MONSTER':'MEMORY'} ${state.q+1}/10 · Score ${state.score}</span><span>💎 ${state.crystals}/10 · ${'❤️'.repeat(state.lives)}${'🖤'.repeat(3-state.lives)}</span></div><div class="progress"><i style="width:${state.q*10}%"></i></div><div class="game-stage" id="stage">${world(x.scene)}<div class="characters"><div>${kitty()}</div><div>${spidey()}</div></div><div class="distance"><i style="width:${10+state.q*9}%"></i></div><div class="ui-layer"><div class="card ${boss?'boss-card':''}" id="card"><p class="kicker">${boss?'Final memories 👾':'Memory check'}</p><h2>${x.q}</h2>${boss?`<div class="boss-meter"><i style="width:${100-(state.q-7)*33}%"></i></div>`:''}<div class="choices">${x.o.map((v,i)=>`<button class="choice" data-i="${i}">${v}</button>`).join('')}</div></div></div></div></div></section></main>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function answer(i,b){if(state.locked)return;state.locked=true;const x=questions[state.q];if(i===x.a){b.classList.add('correct');state.crystals++;state.score+=100+(state.q>=7?75:0);sfx('ok');setTimeout(()=>memory(x),600)}else{b.classList.add('wrong');state.lives--;sfx('bad');const e=document.createElement('div');e.className='emotional';e.innerHTML=`<div class="card"><h2>Memory fading… 💔</h2><p>${wrongLines[state.q%wrongLines.length]}</p><button class="cta" id="retry">Try again</button></div>`;document.getElementById('stage').appendChild(e);if(state.lives<=0){state.lives=3;state.score=Math.max(0,state.score-150)}document.getElementById('retry').onclick=travel}}
function memory(x){const layer=document.querySelector('.ui-layer');layer.innerHTML=`<div class="card memory-card"><div style="font-size:3rem">💎✨</div><p class="kicker">Memory recovered</p><h2>${x.title}</h2><p><b>${x.date}</b></p><p>${x.detail}</p><button class="cta" id="next">${state.q===9?'Complete the rescue':'Follow the next memory'}</button></div>`;document.getElementById('next').onclick=()=>{state.q++;state.q>=10?finale():travel()}}
function finale(){root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="finale" id="finale">${world('rooftop')}<div class="caption">ALL TEN MEMORIES ARE HOME 💗</div><svg class="web-svg" viewBox="0 0 1080 740" preserveAspectRatio="none"><line id="webLine" class="web-path" x1="870" y1="445" x2="190" y2="445"/></svg><div class="hero kitty" id="fk">${kitty(true)}</div><div class="hero spidey" id="fs">${spidey(true)}</div><div class="heart" id="heart">💗</div><button class="cta letterBtn" id="letterBtn">Open birthday letter 💌</button><div class="overlay hidden" id="overlay"><article class="letter"><p class="kicker">Mission complete</p><h2>Spider-Man saved. Birthday girl victorious. 💗</h2><p>You found every memory, crossed every place, and still found your way back to me.</p><p>Happy birthday, Pihu. This little world was made only for you.</p><button class="cta" id="again">Play again</button></article></div></div></div></section></main>`;const line=document.getElementById('webLine'),k=document.getElementById('fk'),s=document.getElementById('fs'),h=document.getElementById('heart'),mobile=innerWidth<700;setTimeout(()=>line.animate([{strokeDashoffset:1000},{strokeDashoffset:0}],{duration:900,fill:'forwards',easing:'ease-out'}),350);setTimeout(()=>k.animate([{left:mobile?'2%':'8%',transform:'rotate(0)'},{left:mobile?'42%':'45%',transform:'rotate(7deg)'}],{duration:1400,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'}),1150);setTimeout(()=>{line.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});k.animate([{left:mobile?'42%':'45%',transform:'rotate(7deg)'},{left:mobile?'43%':'46%',transform:'rotate(-5deg)'}],{duration:500,fill:'forwards'});s.animate([{right:mobile?'2%':'8%',transform:'rotate(0)'},{right:mobile?'37%':'37%',transform:'rotate(5deg)'}],{duration:500,fill:'forwards'})},2700);setTimeout(()=>{h.animate([{opacity:0,transform:'translateX(-50%) scale(.2)'},{opacity:1,transform:'translateX(-50%) scale(1.5)'},{opacity:0,transform:'translateX(-50%) translateY(-95px) scale(.7)'}],{duration:1450,fill:'forwards'});sfx('kiss')},3350);setTimeout(()=>{k.animate([{transform:'rotate(-5deg)'},{transform:'rotate(2deg) translateX(20px)'}],{duration:600,fill:'forwards'});s.animate([{transform:'rotate(5deg)'},{transform:'rotate(-2deg) translateX(-20px)'}],{duration:600,fill:'forwards'});confetti()},4200);setTimeout(()=>document.getElementById('letterBtn').classList.add('show'),5300);document.getElementById('letterBtn').onclick=()=>document.getElementById('overlay').classList.remove('hidden');document.getElementById('again').onclick=()=>{Object.assign(state,{q:0,lives:3,crystals:0,score:0,locked:false});intro()}}
function confetti(){for(let i=0;i<140;i++){const p=document.createElement('div');p.textContent=['💗','🎀','✨','🌸','❤️'][i%5];Object.assign(p.style,{position:'fixed',left:Math.random()*100+'vw',top:'-50px',zIndex:999,fontSize:(15+Math.random()*22)+'px',pointerEvents:'none'});document.body.appendChild(p);p.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY(112vh) rotate(900deg)'}],{duration:3200+Math.random()*2500,delay:Math.random()*1000,easing:'linear'});setTimeout(()=>p.remove(),7000)}}intro();})();
</script></body></html>
