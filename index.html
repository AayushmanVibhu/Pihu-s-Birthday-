<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07091b">
  <title>Hello Kitty to the Rescue</title>
  <link rel="stylesheet" href="./style.css?v=4">
  <link rel="stylesheet" href="./fixes.css?v=4">
  <link rel="stylesheet" href="./finale-polish.css?v=2">
  <style>
    html,body{margin:0;min-height:100%;background:#07091b}.boot-shell{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:radial-gradient(circle at top,#262657,#07091b 65%)}.boot-card{width:min(560px,100%);padding:34px 28px;border:1px solid #ffffff24;border-radius:28px;text-align:center;background:#ffffff12;box-shadow:0 24px 80px #0008;backdrop-filter:blur(12px)}.boot-heart{font-size:54px;animation:bootPulse 1.2s ease-in-out infinite}.boot-kicker{text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;opacity:.72}.boot-card h1{font-size:clamp(1.8rem,6vw,3rem);margin:.4em 0}.boot-card p{line-height:1.6}.boot-dots{display:flex;justify-content:center;gap:8px;margin-top:22px}.boot-dots i{width:9px;height:9px;border-radius:50%;background:#ff78b7;animation:bootDot 1s ease-in-out infinite}.boot-dots i:nth-child(2){animation-delay:.15s}.boot-dots i:nth-child(3){animation-delay:.3s}.boot-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}.boot-button{border:0;border-radius:999px;padding:13px 20px;background:#ff78b7;color:#241224;font-weight:800;text-decoration:none;cursor:pointer}.boot-secondary{background:#ffffff18;color:#fff;border:1px solid #ffffff36}.boot-error details{margin-top:22px;text-align:left;opacity:.75}.boot-error pre{white-space:pre-wrap;overflow-wrap:anywhere}.sound{position:fixed;z-index:1000;right:16px;top:16px}@keyframes bootPulse{50%{transform:scale(1.12)}}@keyframes bootDot{50%{transform:translateY(-8px);opacity:.4}}
  </style>
</head>
<body>
  <div id="root"></div>
  <button class="sound" id="sound" aria-label="Toggle sound">🔊</button>
  <noscript><main class="boot-shell"><section class="boot-card"><h1>JavaScript is required</h1><p>Please enable JavaScript to play Pihu's birthday game.</p></section></main></noscript>
  <script src="./bootstrap.js?v=2"></script>
</body>
</html>
