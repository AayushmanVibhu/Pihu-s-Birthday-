<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hello Kitty to the Rescue</title><style>:root{--p:#ff72b5;--h:#ff3e7d;--i:#2f2038}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#07091b;color:#fff;touch-action:none}button{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 70% 8%,#36549b,#17204c 30%,#07091b 72%);overflow:hidden}.screen{min-height:100vh;display:grid;place-items:center;padding:18px}.panel,.mission{width:min(1100px,96vw)}.panel{padding:clamp(25px,5vw,56px);border-radius:32px;text-align:center;background:#080d24e8;border:1px solid #ffffff24;box-shadow:0 30px 90px #0009}.k{letter-spacing:.18em;color:#ffc6df;font-size:.75rem;font-weight:900;text-transform:uppercase}.title{font-size:clamp(2.7rem,8vw,6rem);line-height:.93;margin:12px 0}.title span{color:var(--p)}.lead{max-width:760px;margin:auto;color:#ffffffd6;line-height:1.7}.cta,.choice{border:0;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer}.cta{color:#fff;background:linear-gradient(135deg,var(--p),var(--h));box-shadow:0 12px 30px #ff3e7d44}.choice{width:100%;text-align:left;background:#fff;color:#392942;border:2px solid #efc4d8}.choice.correct{background:#ddf8e7;border-color:#58c883}.choice.wrong{background:#ffe1e7;border-color:#ed7087}.duo{display:flex;align-items:end;justify-content:center;gap:30px;margin:30px 0}.char{width:145px;height:185px;filter:drop-shadow(0 18px 18px #0008)}.char svg{width:100%;height:100%;overflow:visible}.sound{position:fixed;right:16px;top:16px;z-index:500;width:50px;height:50px;border-radius:50%;border:1px solid #ffffff30;background:#0a1028df;color:#fff;font-size:1.25rem}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff20}.stage{position:relative;height:min(72vh,690px);min-height:590px;border-radius:30px;overflow:hidden;border:1px solid #ffffff22;box-shadow:0 28px 90px #0009}.world{position:absolute;inset:0;background:linear-gradient(#274680 0 58%,#121a32 58%)}.world.park{background:linear-gradient(#6a4b78 0 54%,#293d39 54%)}.world.call{background:linear-gradient(#173b61 0 55%,#192238 55%)}.world.rooftop{background:linear-gradient(#294683 0 62%,#111626 62%)}.moon{position:absolute;width:110px;height:110px;border-radius:50%;right:8%;top:8%;background:#fff1b2;box-shadow:0 0 70px #fff1b266}.cloud{position:absolute;width:175px;height:44px;border-radius:999px;background:#ffffff20;animation:cloud 16s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:68px;height:68px;left:25px;top:-28px}.cloud:after{width:78px;height:78px;right:24px;top:-34px}@keyframes cloud{from{transform:translateX(-250px)}to{transform:translateX(1250px)}}.buildings{position:absolute;left:0;right:0;bottom:90px;height:250px;background:repeating-linear-gradient(90deg,#0d1631 0 90px,#18264a 90px 155px,#101b38 155px 250px)}.tree{position:absolute;bottom:88px;width:100px;height:225px;background:#17291f;border-radius:60% 60% 8px 8px}.road{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(#293452,#111829);border-top:3px solid #ffffff18}.road:after{content:"";position:absolute;left:0;right:0;top:44px;height:5px;background:repeating-linear-gradient(90deg,#fff8 0 42px,transparent 42px 85px);animation:road 1s linear infinite}@keyframes road{to{background-position:-170px 0}}.player{position:absolute;left:6%;bottom:72px;z-index:8;will-change:left,bottom}.player.running .char{animation:run .22s ease-in-out infinite alternate}@keyframes run{to{transform:translateY(-10px) rotate(3deg)}}.gatewrap{position:absolute;right:13%;bottom:90px;z-index:7;width:110px;height:180px;display:grid;place-items:end center}.gate{width:95px;height:145px;border:9px solid size:clamp(1.3rem,3vw,2.1rem);font-weight:900;text-align:center}.hero{position:absolute;bottom:88px;width:165px;z-index:8}.hero.kitty{left:8%}.hero.spidey{right:8%}.websvg{position:absolute;inset:0;z-index:7;width:100%;height:100%;pointer-events:none}.webpath{stroke:#fff;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 5px #fff);stroke-dasharray:1000;stroke-dashoffset:1000}.heart{position:absolute;z-index:12;left:50%;bottom:280px;font-size:72px;opacity:0;transform:translateX(-50%) scale(.2)}.letterbtn{position:absolute;z-index:14;left:50%;bottom:16px;transform:translateX(-50%);opacity:0;pointer-events:none}.letterbtn.show{opacity:1;pointer-events:auto}@media(max-width:700px){.stage{height:76vh;min-height:620px}.char{width:105px;height:140px}.player{bottom:75px}.gatewrap{right:10%;transform:scale(.85)}.ctrl{width:56px;height:52px}.dialogue{top:14%;right:3%;font-size:.8rem}.hero{width:115px}.hero.kitty{left:2%}.hero.spidey{right:2%}.heart{bottom:230px}.controls{bottom:10px}}</style></head><body><div id="root"></div><button class="sound" id="sound">🔊</button><script>(()=>{'use strict';const root=document.getElementById('root'),S={q:0,l:3,c:0,score:0,sound:true,a:null,m:false,mt:null,x:6,y:0,vy:0,onGround:true,open:false,collect:false,keys:{},loop:null,hurdles:[]};const Q=[['city','Hum pehli baar December mein kis date ko mile the?',['24 December','25 December','26 December','28 December'],2,'26 December 2022','Jab hum pehli baar mile','Wahi din jab ek normal si meeting ne hamari story ka pehla page likh diya.'],['city','Hamari story mein sabse pehle kya hua tha?',['Humne numbers exchange kiye','Hamari pehli call hui','Hum pehli baar mile','Hum officially date karne lage'],2,'26 December 2022','Yahin se sab shuru hua','Sabse pehle hum mile the. Baaki sab uske baad aaya.'],['call','Humne March mein kis date ko numbers exchange kiye the?',['3 March','5 March','6 March','8 March'],1,'5 March 2023','Finally, tera number mil gaya','Ussi din humne numbers exchange kiye aur story thodi aur real ho gayi.'],['call','Hamari pehli phone call kis month mein hui thi?',['August','September','October','November'],1,'8 September 2023','Hamari pehli call','Aur woh bhi koi seedhi-saadhi call nahi thi—tu aur didi milkar mujhe prank kar rahe the 💀'],['call','Pehli phone call mein tu aur didi kya kar rahe the?',['Birthday plan bana rahe the','Mujhe lecture de rahe the','Ek ladki bankar prank kar rahe the','Gaana record kar rahe the'],2,'8 September 2023','Woh legendary prank call','Tune aur didi ne ek imaginary ladki bana di aur main genuinely confuse ho gaya tha.'],['rooftop','Hum officially dating December mein kis date ko start hue?',['11 December','12 December','13 December','14 December'],2,'13 December 2024','Jis din hum “hum” bane','Iss din maine tujhe propose kiya aur hum officially dating start hue.'],['rooftop','Hamari timeline ka sahi order kaunsa hai?',['Pehli call → numbers → dating','Numbers → pehli meeting → dating','Pehli meeting → numbers → pehli call → dating','Dating → pehli call → numbers'],2,'Hamari timeline','Tune poori timeline jod di','Pehle hum mile, phir numbers, phir prank call, aur phir officially hum.'],['park','Deer Park wali misunderstanding mein tune exactly kya bola tha?',['Should I?','Shirt','Sure?','Shh'],1,'23 May 2025 · Deer Park','“Shirt?”','Tune “shirt” bola, mujhe “should I?” sunayi diya, aur main “Are you sure?” bolkar khud hi phas gaya 💀'],['park','Deer Park wale moment ke baad countdown kya tha?',['5… 4… 3… GO','3… 2… 1… GO','1… 2… 3… GO','Ready… set… GO'],1,'23 May 2025','3… 2… 1… GO ❤️','Thodi embarrassment ke baad bhi tune uss moment ko legendary bana diya.'],['park','Mujhe tease karne ke liye tune kaunsa gaana bheja tha?',['Lag Ja Gale','Pehla Nasha','Buddha Mil Gaya','Pal Pal Dil Ke Paas'],2,'Hamari teasing anthem','“Mujhe Buddha Mil Gaya”','Sirf isliye kyunki main kabhi-kabhi zyada mature act karta hoon. Accha ji, itna bhi buddha nahi hoon 😭']];const intro=['Ek shaant raat thi. Hello Kitty apni birthday walk par nikli thi… 🎀','Tabhi aasman se ek tooti hui spider-web uske paas aa kar giri.','Memory Monster ne Spider-Man ko pakad liya tha aur hamari yaadon ko 10 crystals mein tod diya tha.','“Pihu! Agar yaadein wapas nahi aayi, toh meri web toot jayegi…”','Ab sirf tu hi har memory wapas laa kar Spider-Man ko bacha sakti hai.','Chal Pihu. Ab tu khud Hello Kitty ko chala kar mere paas aayegi. 💗'],wrong=['Areee Pihu… web aur slip ho gayi 😭','Mujhe laga tujhe yeh yaad hoga… koi nahi, ek aur try kar 🥺','Main gir raha hoon, par mujhe abhi bhi tujh par trust hai ❤️','Memory Monster aur strong ho raha hai… jaldi kar!','Nooo, yeh meri favourite memories mein se ek thi 😭'];function kitty(bl=false){return `<div class="char"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="194" rx="47" ry="16" fill="#0003"/><path d="M54 56 38 22 72 42M126 56l16-34-34 20" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="90" cy="78" rx="59" ry="51" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="70" cy="77" rx="5" ry="8"/><ellipse cx="112" cy="77" rx="5" ry="8"/><ellipse cx="91" cy="91" rx="7" ry="5" fill="#ffd54d"/>${bl?'<ellipse cx="57" cy="98" rx="12" ry="6" fill="#ff8cab"/><ellipse cx="123" cy="98" rx="12" ry="6" fill="#ff8cab"/>':''}<path d="M78 105q13 12 27 0" fill="none" stroke="#2b2130" stroke-width="4"/><path d="M126 47c11-15 27-10 27 3 0 12-14 17-27 8-13 9-27 4-27-8 0-13 16-18 27-3Z" fill="#ff6faa" stroke="#2b2130" stroke-width="4"/><path d="M59 125q31-17 62 0l12 60H47z" fill="#ff78b7" stroke="#2b2130" stroke-width="5"/><path d="M57 139 28 164M123 139l29 25M69 184l-8 25M111 184l8 25" stroke="#2b2130" stroke-width="7" stroke-linecap="round"/></svg></div>`}function spidey(bl=false){return `<div class="char"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="201" rx="42" ry="13" fill="#0003"/><ellipse cx="90" cy="61" rx="39" ry="43" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M63 51q12-13 20 4-9 31-25 8Zm54 0q-12-13-20 4 9 31 25 8Z" fill="#fff" stroke="#181521" stroke-width="4"/>${bl?'<ellipse cx="55" cy="82" rx="11" ry="6" fill="#ff9ab6"/><ellipse cx="125" cy="82" rx="11" ry="6" fill="#ff9ab6"/>':''}<path d="M90 19v83M54 41l72 42M126 41 54 83M51 62h78" stroke="#181521" stroke-width="2"/><path d="M61 103q29-18 58 0l15 68-29 20H75l-29-20z" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M61 111 43 174M119 111l18 63M72 181l-9 29M108 181l9 29" stroke="#173c78" stroke-width="18" stroke-linecap="round"/></svg></div>`}function decor(s){return `<div class="world ${s}"><div class="moon"></div><div class="cloud" style="top:18%"></div><div class="cloud" style="top:34%;animation-delay:-8s;opacity:.55"></div>${s==='park'?'<div class="tree" style="left:5%"></div><div class="tree" style="right:6%;height:255px"></div>':'<div class="buildings"></div>'}<div class="road"></div></div>`}function tone(f,d=.15,t='sine',g=.045){if(!S.sound)return;try{const A=window.AudioContext||window.webkitAudioContext,c=S.a||(S.a=new A()),o=c.createOscillator(),v=c.createGain();o.type=t;o.frequency.value=f;v.gain.setValueAtTime(g,c.currentTime);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}function music(){if(!S.sound||S.m)return;S.m=true;let n=0,a=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];S.mt=setInterval(()=>tone(a[n++%a.length],.55,'sine',.018),520)}function stopMusic(){clearInterval(S.mt);S.m=false}sound.onclick=()=>{S.sound=!S.sound;sound.textContent=S.sound?'🔊':'🔇';S.sound?music():stopMusic()};function introScreen(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="k">Pihu turns 20</p><h1 class="title"><span>Hello Kitty</span><br>to the Rescue</h1><p class="lead">Tu Kitty ko khud chalayegi, obstacles jump karegi aur har memory gate cross karke mere paas aayegi.</p><div class="duo">${kitty()}<b style="font-size:48px">💗</b>${spidey()}</div><button class="cta" id="begin">Story shuru kar 🎀</button></div></section></main>`;begin.onclick=()=>{music();cut(0)}}function cut(i){if(i>=intro.length)return brief();root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="k">Ek chhoti si kahani…</p><div style="font-size:clamp(1.3rem,3vw,2rem);min-height:150px;display:grid;place-items:center">${intro[i]}</div><button class="cta" id="next">${i===intro.length-1?'Mission shuru kar':'Aage'}</button></div></section></main>`;next.onclick=()=>cut(i+1)}function brief(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="k">Controls</p><h1>Kitty ko tu chalayegi 🎀</h1><p class="lead"><b>← → / A D</b> se chal. <b>↑ / W / Space</b> se jump kar. Mobile par neeche ke buttons use kar. Gate par sawaal khulega.</p><div style="font-size:2rem;margin:24px">⬅️ Kitty ⬆️ ➡️ &nbsp; 📦 🔒 💎</div><button class="cta" id="go">Chal, mujhe bacha le</button></div></section></main>`;go.onclick=level}function plan(q){return[[],[[31,52,'']],[[27,52,''],[47,88,'tall']],[[24,52,''],[39,52,''],[55,106,'stack']],[[34,88,'tall']],[[25,52,''],[45,106,'stack']],[[22,52,''],[36,88,'tall'],[52,52,'']],[[30,106,'stack'],[50,88,'tall']],[[24,52,''],[39,106,'stack'],[55,52,'']],[[22,88,'tall'],[38,52,''],[52,106,'stack']]][q]||[]}function hurdles(){return S.hurdles.map((o,i)=>`<div class="hurdle" style="left:${o[0]}%"><div class="crate ${o[2]}"></div></div>`).join('')}function jump(){if(S.onGround){S.vy=15;S.onGround=false;tone(420,.08,'square',.025)}}function level(){clearInterval(S.loop);Object.assign(S,{x:6,y:0,vy:0,onGround:true,open:false,collect:false});S.hurdles=plan(S.q);let x=Q[S.q];root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>Yaad ${S.q+1}/10 · Score ${S.score}</span><span>💎 ${S.c}/10 · ${'❤️'.repeat(S.l)}${'🖤'.repeat(3-S.l)}</span></div><div class="stage" id="stage">${decor(x[0])}<div class="hint">${S.hurdles.length?'Obstacles ko jump karke gate tak pahunch!':'Gate tak jaa — phir dekhte ha
