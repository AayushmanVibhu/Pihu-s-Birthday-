<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07091b" />
  <meta name="description" content="A cute animated rescue adventure made for Pihu's 20th birthday." />
  <title>Hello Kitty to the Rescue</title>
  <link rel="stylesheet" href="./game.css?v=20260730-2304" />
</head>
<body>
  <div id="root">
    <main style="min-height:100vh;display:grid;place-items:center;background:#07091b;color:white;font-family:system-ui;text-align:center;padding:24px">
      <div><h1>Loading rescue mission… 🎀</h1><p>Please refresh once if this stays visible.</p></div>
    </main>
  </div>
  <script>
    window.addEventListener('error', function (event) {
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#07091b;color:white;font-family:system-ui;text-align:center;padding:24px"><div><h1>The game hit an error 💔</h1><p>' + String(event.message || 'Unknown script error') + '</p><button onclick="location.reload(true)" style="border:0;border-radius:999px;padding:14px 22px;background:#ff78b7;color:white;font-weight:800;cursor:pointer">Reload game</button></div></main>';
    });
  </script>
  <script src="./game.js?v=20260730-2304"></script>
</body>
</html>
