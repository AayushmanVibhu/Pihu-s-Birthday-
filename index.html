<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Kitty to the Rescue</title>
<style>
:root{--pink:#ff78b7;--hot:#ff3f7f;--cream:#fff9f1;--ink:#281b33;--night:#07091b;--gold:#ffd867}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,sans-serif;background:#07091b;color:#fff}button{font:inherit}.app{min-height:100vh;overflow:hidden;background:radial-gradient(circle at 72% 10%,#36549a 0,#16204d 29%,#07091b 70%)}.screen{min-height:100vh;display:grid;place-items:center;padding:18px}.panel,.mission{width:min(1080px,96vw)}.panel{padding:clamp(24px,5vw,56px);border-radius:32px;text-align:center;background:#080d24dc;border:1px solid #ffffff26;box-shadow:0 30px 90px #0009}.kicker{text-transform:uppercase;letter-spacing:.18em;color:#ffc7de;font-size:.75rem;font-weight:900}.title{font-size:clamp(2.7rem,8vw,6rem);line-height:.92;margin:12px 0}.title span{color:var(--pink)}.lead{max-width:760px;margin:0 auto;line-height:1.7;color:#ffffffd4}.cta,.choice{border:0;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--hot));color:#fff;box-shadow:0 12px 30px #ff3f7f44}.choice{background:#fff;color:#382741;border:2px solid #efc6d7;box-shadow:none;text-align:left}.choice:hover{transform:translateY(-2px);border-color:var(--pink)}.duo{display:flex;align-items:end;justify-content:center;gap:30px;margin:30px 0}.character{width:170px;height:215px;filter:drop-shadow(0 18px 18px #0008)}.character svg{width:100%;height:100%;overflow:visible}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff20}.progress{height:10px;background:#ffffff15;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:.4s}.scene{position:relative;min-height:640px;border-radius:30px;overflow:hidden;border:1px solid #ffffff22;box-shadow:0 28px 90px #0009;background:linear-gradient(#274680 0 58%,#121a32 58%)}.scene.park{background:linear-gradient(#6a4b78 0 54%,#293d39 54%)}.scene.call{background:linear-gradient(#15385a 0 55%,#192238 55%)}.scene.rooftop{background:linear-gradient(#263f7f 0 62%,#111626 62%)}.moon{position:absolute;width:130px;height:130px;border-radius:50%;right:8%;top:8%;background:#fff1b2;box-shadow:0 0 70px #fff1b266}.cloud{position:absolute;width:170px;height:44px;border-radius:999px;background:#ffffff20;animation:cloud 16s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:68px;height:68px;left:25px;top:-28px}.cloud:after{width:78px;height:78px;right:24px;top:-34px}@keyframes cloud{from{transform:translateX(-230px)}to{transform:translateX(1250px)}}.road{position:absolute;left:0;right:0;bottom:0;height:95px;background:linear-gradient(#293452,#111829);border-top:3px solid #ffffff18}.road:after{content:"";position:absolute;left:0;right:0;top:46px;height:5px;background:repeating-linear-gradient(90deg,#fff8 0 42px,transparent 42px 85px);animation:road 1s linear infinite}@keyframes road{to{background-position:-170px 0}}.city{position:absolute;left:0;right:0;bottom:92px;height:43%;background:#0d1631;clip-path:polygon(0 100%,0 45%,8% 45%,8% 12%,18% 12%,18% 58%,28% 58%,28% 4%,39% 4%,39% 52%,50% 52%,50% 19%,61% 19%,61% 64%,72% 64%,72% 7%,83% 7%,83% 52%,92% 52%,92% 26%,100% 26%,100% 100%)}.tree{position:absolute;bottom:88px;width:105px;height:245px;background:#17291f;border-radius:60% 60% 8px 8px}.story-card,.quiz-card,.memory-card,.boss-card{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,90%);padding:26px;border-radius:28px;background:#fffaf5f5;color:var(--ink);box-shadow:0 28px 75px #0009;text-align:center}.story-card p,.memory-card p{line-height:1.7;color:#625469}.story-line{font-size:clamp(1.15rem,3vw,1.8rem);min-height:110px;display:grid;place-items:center}.choices{display:grid;gap:11px}.choice.correct{background:#dff8e8;border-color:#55c582}.choice.wrong{background:#ffe0e6;border-color:#ed6d83}.character-strip{position:absolute;left:4%;right:4%;bottom:78px;display:flex;align-items:end;justify-content:space-between}.distance{position:absolute;left:19%;right:19%;bottom:170px;height:8px;background:#ffffff22;border-radius:99px}.distance i{display:block;height:100%;background:linear-gradient(90deg,#ff78b7,#ffd867);border-radius:99px}.emotional{position:absolute;z-index:15;left:50%;top:46%;transform:translate(-50%,-50%);width:min(560px,88%);padding:22px;border-radius:24px;background:#fff7fb;color:#3d2947;text-align:center;box-shadow:0 24px 70px #0008}.travel-title{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(1.5rem,4vw,2.7rem);z-index:8;text-shadow:0 5px 20px #000}.runner{position:absolute;left:-220px;bottom:72px;z-index:7}.runner .character{animation:runBounce .28s ease-in-out infinite alternate}@keyframes runBounce{to{transform:translateY(-16px) rotate(4deg)}}.crystals{font-size:1.25rem;letter-spacing:.12em}.boss-card{background:#160d26ed;color:#fff;border:2px solid #ff78b7}.boss-card h2{color:#ff9ec9}.boss-meter{height:16px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:16px 0}.boss-meter i{display:block;height:100%;background:linear-gradient(90deg,#ff3f7f,#ffd867)}.sound{position:fixed;right:16px;top:16px;z-index:100;width:50px;height:50px;border-radius:50%;border:1px solid #ffffff30;background:#0a1028dd;color:#fff;font-size:1.25rem;cursor:pointer}.finale{position:relative;min-height:740px;border-radius:30px;overflow:hidden;background:linear-gradient(#263f7f 0 62%,#111626 62%);box-shadow:0 28px 90px #0009}.finale .hero{position:absolute;bottom:95px;width:180px;z-index:8}.finale .kitty{left:8%}.finale .spidey{right:8%}.finale .web{position:absolute;z-index:7;height:4px;background:white;box-shadow:0 0 10px white;right:23%;top:53%;width:0;transform-origin:right center}.finale .heart{position:absolute;z-index:12;left:50%;bottom:315px;font-size:72px;opacity:0;transform:translateX(-50%) scale(.2)}.finale .caption{position:absolute;z-index:12;top:7%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:900}.letterBtn{position:absolute;z-index:14;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;pointer-events:none}.letterBtn.show{opacity:1;pointer-events:auto}.overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#050716e8;padding:24px}.hidden{display:none!important}.letter{width:min(720px,94%);padding:30px;border-radius:24px;background:#fffaf1;color:#35263d;box-shadow:0 30px 90px #0009}.letter p{line-height:1.8;color:#66556c}@media(max-width:700px){.character{width:118px;height:155px}.scene{min-height:670px}.quiz-card,.story-card,.memory-card,.boss-card{padding:19px;top:47%}.character-strip{bottom:70px}.distance{left:24%;right:24%;bottom:145px}.finale{min-height:700px}.finale .hero{width:125px;bottom:95px}.finale .kitty{left:2%}.finale .spidey{right:2%}.finale .web{right:20%;top:57%}.finale .heart{bottom:265px}}
</style>
</head>
<body><div id="root"></div><button class="sound" id="soundBtn">🔊</button>
<script>
(()=>{
'use strict';
const root=document.getElementById('root');
const state={q:0,lives:3,crystals:0,score:0,locked:false,sound:true,music:false,audio:null,musicTimer:null};
const questions=[
{scene:'city',q:'Hum pehli baar December mein kis date ko mile the?',o:['24 December','25 December','26 December','28 December'],a:2,date:'26 December 2022',title:'The first meeting',detail:'Wahi din jab ek normal si meeting ne hamari poori story ka first page likha.'},
{scene:'city',q:'Inmein se hamari story ka sabse pehla milestone kaunsa tha?',o:['Numbers exchange karna','Pehli phone call','Pehli baar milna','Officially dating start karna'],a:2,date:'26 December 2022',title:'Chapter one',detail:'Sabse pehle hum mile. Baaki saare chapters uske baad aaye.'},
{scene:'call',q:'Humne March mein kis date ko numbers exchange kiye the?',o:['3 March','5 March','6 March','8 March'],a:1,date:'5 March 2023',title:'Finally, number mil gaya',detail:'Ussi din humne numbers exchange kiye aur story thodi aur real ho gayi.'},
{scene:'call',q:'Hamari pehli phone call kis month mein hui thi?',o:['August','September','October','November'],a:1,date:'8 September 2023',title:'The first call',detail:'Aur woh bhi ek seedhi-saadhi call nahi thi—tum aur didi prank kar rahe the 💀'},
{scene:'call',q:'Pehli phone call mein tum aur didi kya kar rahe the?',o:['Birthday plan bana rahe the','Mujhe lecture de rahe the','Ek ladki bankar prank kar rahe the','Gaana record kar rahe the'],a:2,date:'8 September 2023',title:'The prank call',detail:'Tum dono ne ek imaginary ladki bana di jisko supposedly mujh mein romantic interest tha, aur main genuinely confuse ho gaya tha.'},
{scene:'rooftop',q:'Hum officially dating December mein kis date ko start hue?',o:['11 December','12 December','13 December','14 December'],a:2,date:'13 December 2024',title:'The day we became us',detail:'Iss din maine tumhe propose kiya aur hum officially dating start hue.'},
{scene:'rooftop',q:'Correct chronological order kaunsa hai?',o:['First call → numbers → dating','Numbers → first meeting → dating','First meeting → numbers → first call → dating','Dating → first call → numbers'],a:2,date:'Our timeline',title:'Memory sequence restored',detail:'First meeting, then numbers, then the prank call, and finally officially us.'},
{scene:'park',q:'Deer Park wali misunderstanding mein tumne exactly kya bola tha?',o:['Should I?','Shirt','Sure?','Shh'],a:1,date:'23 May 2025 · Deer Park',title:'“Shirt?”',detail:'Tumne “shirt” bola, mujhe “should I?” sunayi diya, aur main “Are you sure?” bolkar khud hi phas gaya 💀'},
{scene:'park',q:'Deer Park moment ke baad countdown kaunsa tha?',o:['5…4…3…GO','3…2…1…GO','1…2…3…GO','Ready…set…GO'],a:1,date:'23 May 2025',title:'3… 2… 1… GO ❤️',detail:'Embarrassment ke baad bhi moment eventually legendary ban gaya.'},
{scene:'park',q:'Mujhe tease karne ke liye tumne kaunsa gaana bheja tha?',o:['Lag Ja Gale','Pehla Nasha','Buddha Mil Gaya','Pal Pal Dil Ke Paas'],a:2,date:'The teasing anthem',title:'“Mujhe Buddha Mil Gaya”',detail:'Sirf isliye kyunki main kabhi-kabhi zyada mature act karta hoon. Accha ji, itna bhi buddha nahi hoon 😭'}
];
const introLines=['Ek shaant raat thi. Hello Kitty apni birthday walk par nikli thi… 🎀','Tabhi aasman se ek टूटी hui spider-web uske paas aa kar giri.','Memory Monster ne Spider-Man ko capture kar liya tha… aur hamari memories ko 10 crystals mein tod diya tha.','“Pihu! Agar memories wapas nahi aayi, toh meri web toot jayegi…”','Ab sirf birthday girl hi har memory recover karke Spider-Man ko bacha sakti hai.','Mission: 10 memory crystals collect karo. Three lives. Final boss ko harao. Spider-Man ko ghar lao. 💗'];
const wrongLines=['Areee Pihu… web aur slip ho gayi 😭','Yeh memory blur ho rahi hai… please ek aur try 🥺','Main gir raha hoon, par mujhe abhi bhi tum par trust hai ❤️','Memory Monster strong ho raha hai… jaldi!','Nooo, yeh meri favourite memories mein se ek thi 😭'];
function kitty(blush=false){return `<div class="character"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="194" rx="47" ry="16" fill="#0003"/><path d="M54 56 38 22 72 42M126 56l16-34-34 20" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="90" cy="78" rx="59" ry="51" fill="#fff" stroke="#2b2130" stroke-width="5"/><ellipse cx="70" cy="77" rx="5" ry="8"/><ellipse cx="112" cy="77" rx="5" ry="8"/><ellipse cx="91" cy="91" rx="7" ry="5" fill="#ffd54d"/>${blush?'<ellipse cx="57" cy="98" rx="12" ry="6" fill="#ff8cab"/><ellipse cx="123" cy="98" rx="12" ry="6" fill="#ff8cab"/>':''}<path d="M78 105q13 12 27 0" fill="none" stroke="#2b2130" stroke-width="4"/><path d="M126 47c11-15 27-10 27 3 0 12-14 17-27 8-13 9-27 4-27-8 0-13 16-18 27-3Z" fill="#ff6faa" stroke="#2b2130" stroke-width="4"/><path d="M59 125q31-17 62 0l12 60H47z" fill="#ff78b7" stroke="#2b2130" stroke-width="5"/><path d="M57 139 28 164M123 139l29 25M69 184l-8 25M111 184l8 25" stroke="#2b2130" stroke-width="7" stroke-linecap="round"/></svg></div>`}
function spidey(blush=false){return `<div class="character"><svg viewBox="0 0 180 220"><ellipse cx="90" cy="201" rx="42" ry="13" fill="#0003"/><ellipse cx="90" cy="61" rx="39" ry="43" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M63 51q12-13 20 4-9 31-25 8Zm54 0q-12-13-20 4 9 31 25 8Z" fill="#fff" stroke="#181521" stroke-width="4"/>${blush?'<ellipse cx="55" cy="82" rx="11" ry="6" fill="#ff9ab6"/><ellipse cx="125" cy="82" rx="11" ry="6" fill="#ff9ab6"/>':''}<path d="M90 19v83M54 41l72 42M126 41 54 83M51 62h78" stroke="#181521" stroke-width="2"/><path d="M61 103q29-18 58 0l15 68-29 20H75l-29-20z" fill="#e83b51" stroke="#181521" stroke-width="5"/><path d="M61 111 43 174M119 111l18 63M72 181l-9 29M108 181l9 29" stroke="#173c78" stroke-width="18" stroke-linecap="round"/></svg></div>`}
function decor(scene){return `<div class="moon"></div><div class="cloud" style="top:18%"></div><div class="cloud" style="top:34%;animation-delay:-8s;opacity:.55"></div>${scene==='park'?'<div class="tree" style="left:5%"></div><div class="tree" style="right:6%;height:275px"></div>':'<div class="city"></div>'}<div class="road"></div>`}
function tone(f,d=.15,type='sine',g=.045){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;const c=state.audio||(state.audio=new A());const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,c.currentTime);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}
function sfx(kind){if(kind==='ok')[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*100));else if(kind==='bad'){tone(220,.22,'sawtooth');setTimeout(()=>tone(155,.35,'sawtooth'),150)}else [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*90))}
function startMusic(){if(!state.sound||state.music)return;state.music=true;let step=0;const seq=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];state.musicTimer=setInterval(()=>{tone(seq[step++%seq.length],.55,'sine',.018)},520)}
function stopMusic(){clearInterval(state.musicTimer);state.musicTimer=null;state.music=false}
function toggleSound(){state.sound=!state.sound;document.getElementById('soundBtn').textContent=state.sound?'🔊':'🔇';if(state.sound)startMusic();else stopMusic()}
document.getElementById('soundBtn').onclick=toggleSound;
function intro(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="kicker">Pihu turns 20 · Rescue Adventure</p><h1 class="title"><span>Hello Kitty</span><br>to the Rescue</h1><p class="lead">This time it is not just a quiz. It is a complete memory mission with 10 crystals, harder options, a boss battle, moving locations and a cinematic rescue.</p><div class="duo">${kitty()}<div style="font-size:48px">💗</div>${spidey()}</div><button class="cta" id="begin">Begin story 🎀</button></div></section></main>`;document.getElementById('begin').onclick=()=>{startMusic();cutscene(0)}}
function cutscene(i){if(i>=introLines.length)return missionBrief();root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="scene rooftop">${decor('rooftop')}<div class="story-card"><p class="kicker">Opening Cutscene ${i+1}/${introLines.length}</p><div class="story-line">${introLines[i]}</div><button class="cta" id="continue">${i===introLines.length-1?'Accept mission':'Continue'}</button></div></div></div></section></main>`;document.getElementById('continue').onclick=()=>cutscene(i+1)}
function missionBrief(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><p class="kicker">Mission Rules</p><h1>Recover all 10 crystals</h1><p class="lead">Dates are intentionally confusing, some levels test chronology, and the final three memories form a rapid boss round. A wrong answer costs one heart, but the mission continues.</p><div style="font-size:2rem;margin:25px 0">💎 × 10 &nbsp; ❤️ × 3 &nbsp; 👾 Final Boss</div><button class="cta" id="go">Start mission</button></div></section></main>`;document.getElementById('go').onclick=travel}
function travel(){const x=questions[state.q];root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>Traveling to memory ${state.q+1}/10</span><span class="crystals">💎 ${state.crystals}/10 · ${'❤️'.repeat(state.lives)}</span></div><div class="scene ${x.scene}">${decor(x.scene)}<div class="travel-title">${state.q>=7?'Entering the Memory Monster’s lair… 👾':'Run Pihu, run! 🎀'}</div><div class="runner" id="runner">${kitty()}</div></div></div></section></main>`;document.getElementById('runner').animate([{transform:'translateX(0) translateY(0)'},{transform:'translateX(48vw) translateY(-18px)'},{transform:'translateX(calc(100vw + 260px)) translateY(0)'}],{duration:3000,easing:'linear'});setTimeout(game,3050)}
function game(){state.locked=false;const x=questions[state.q],boss=state.q>=7;root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>${boss?'BOSS ROUND':'LEVEL'} ${state.q+1}/10 · Score ${state.score}</span><span class="crystals">💎 ${state.crystals}/10 · ${'❤️'.repeat(state.lives)}${'🖤'.repeat(3-state.lives)}</span></div><div class="progress"><i style="width:${state.q*10}%"></i></div><div class="scene ${x.scene}" id="scene">${decor(x.scene)}<div class="character-strip"><div id="kitty">${kitty()}</div><div id="spidey">${spidey()}</div></div><div class="distance"><i style="width:${10+state.q*9}%"></i></div><div class="${boss?'boss-card':'quiz-card'}" id="card"><p class="kicker">${boss?'Memory Monster Challenge 👾':'Memory Check'}</p><h2>${x.q}</h2>${boss?`<div class="boss-meter"><i style="width:${100-(state.q-7)*33}%"></i></div>`:''}<div class="choices">${x.o.map((v,i)=>`<button class="choice" data-i="${i}">${v}</button>`).join('')}</div></div></div></div></section></main>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function answer(i,b){if(state.locked)return;state.locked=true;const x=questions[state.q];if(i===x.a){b.classList.add('correct');state.crystals++;state.score+=100+(state.q>=7?75:0);sfx('ok');setTimeout(()=>memory(x),650)}else{b.classList.add('wrong');state.lives--;sfx('bad');const e=document.createElement('div');e.className='emotional';e.innerHTML=`<h2>Memory damaged 💔</h2><p>${wrongLines[state.q%wrongLines.length]}</p><button class="cta" id="retry">Try this memory again</button>`;document.getElementById('scene').appendChild(e);if(state.lives<=0){state.lives=3;state.score=Math.max(0,state.score-150)}document.getElementById('retry').onclick=travel}}
function memory(x){const e=document.createElement('div');e.className='memory-card';e.innerHTML=`<div style="font-size:3rem">💎✨</div><p class="kicker">Memory Crystal Recovered</p><h2>${x.title}</h2><p><b>${x.date}</b></p><p>${x.detail}</p><button class="cta" id="next">${state.q===9?'Face the final rescue':'Continue journey'}</button>`;document.getElementById('scene').appendChild(e);document.getElementById('next').onclick=()=>{state.q++;state.q>=10?finale():travel()}}
function finale(){root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="finale" id="finale">${decor('rooftop')}<div class="caption">ALL 10 MEMORIES RESTORED 💗</div><div class="web" id="web"></div><div class="hero kitty" id="fk">${kitty(true)}</div><div class="hero spidey" id="fs">${spidey(true)}</div><div class="heart" id="heart">💗</div><button class="cta letterBtn" id="letterBtn">Open birthday letter 💌</button><div class="overlay hidden" id="overlay"><article class="letter"><p class="kicker">Mission Complete</p><h2>Spider-Man saved. Birthday girl victorious. 💗</h2><p>You recovered every memory, defeated the Memory Monster, crossed every place and still found your way back to me.</p><p>Happy birthday, Pihu. This entire little world was made only for you.</p><button class="cta" id="again">Play again</button></article></div></div></div></section></main>`;
const web=document.getElementById('web'),k=document.getElementById('fk'),s=document.getElementById('fs'),h=document.getElementById('heart');const mobile=innerWidth<700;const kittyStart=mobile?'2%':'8%',kittyHook=mobile?'46%':'51%',spideyEnd=mobile?'39%':'38%';
setTimeout(()=>web.animate([{width:'0'},{width:mobile?'58%':'64%'}],{duration:850,fill:'forwards',easing:'ease-out'}),400);
setTimeout(()=>k.animate([{left:kittyStart,transform:'rotate(0deg)'},{left:kittyHook,transform:'rotate(7deg)'}],{duration:1450,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'}),1100);
setTimeout(()=>{web.animate([{opacity:1},{opacity:0}],{duration:350,fill:'forwards'});k.animate([{left:kittyHook,transform:'rotate(7deg)'},{left:mobile?'44%':'47%',transform:'rotate(-5deg)'}],{duration:500,fill:'forwards'});s.animate([{right:'8%',transform:'rotate(0)'},{right:spideyEnd,transform:'rotate(5deg)'}],{duration:500,fill:'forwards'})},2750);
setTimeout(()=>{h.animate([{opacity:0,transform:'translateX(-50%) scale(.2)'},{opacity:1,transform:'translateX(-50%) scale(1.5)'},{opacity:0,transform:'translateX(-50%) translateY(-95px) scale(.7)'}],{duration:1450,fill:'forwards'});sfx('kiss')},3400);
setTimeout(()=>{k.animate([{transform:'rotate(-5deg)'},{transform:'rotate(2deg) translateX(20px)'}],{duration:600,fill:'forwards'});s.animate([{transform:'rotate(5deg)'},{transform:'rotate(-2deg) translateX(-20px)'}],{duration:600,fill:'forwards'});confetti()},4300);
setTimeout(()=>document.getElementById('letterBtn').classList.add('show'),5400);document.getElementById('letterBtn').onclick=()=>document.getElementById('overlay').classList.remove('hidden');document.getElementById('again').onclick=()=>{Object.assign(state,{q:0,lives:3,crystals:0,score:0,locked:false});intro()}}
function confetti(){for(let i=0;i<150;i++){const p=document.createElement('div');p.textContent=['💗','🎀','✨','🌸','❤️'][i%5];Object.assign(p.style,{position:'fixed',left:Math.random()*100+'vw',top:'-50px',zIndex:99,fontSize:(15+Math.random()*22)+'px',pointerEvents:'none'});document.body.appendChild(p);p.animate([{transform:'translateY(0) rotate(0deg)'},{transform:'translateY(112vh) rotate(900deg)'}],{duration:3200+Math.random()*2800,delay:Math.random()*1200,easing:'linear'});setTimeout(()=>p.remove(),7200)}}
intro();
})();
</script></body></html>
