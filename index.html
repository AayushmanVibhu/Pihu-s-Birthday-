<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hello Kitty to the Rescue</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#071024;color:#fff;touch-action:none}button{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 70% 10%,#36549b,#17204c 35%,#07091b 75%)}.screen{min-height:100vh;display:grid;place-items:center;padding:16px}.panel,.mission{width:min(1050px,96vw)}.panel,.card{background:#0a1028ee;border:1px solid #ffffff22;border-radius:28px;box-shadow:0 25px 80px #0008}.panel{padding:40px;text-align:center}.title{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.95;margin:10px 0}.title span{color:#ff72b5}.lead{line-height:1.7;color:#ffffffd8}.cta,.choice{border:0;border-radius:999px;padding:14px 22px;font-weight:800;cursor:pointer}.cta{background:linear-gradient(135deg,#ff72b5,#ff3e7d);color:#fff}.duo{display:flex;justify-content:center;align-items:end;gap:28px;margin:28px 0}.char{font-size:92px;filter:drop-shadow(0 12px 14px #0008)}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:12px;border-radius:999px;background:#ffffff12}.stage{position:relative;height:min(74vh,680px);min-height:580px;overflow:hidden;border-radius:28px;border:1px solid #ffffff22;background:linear-gradient(#294683 0 60%,#151c32 60%)}.moon{position:absolute;right:8%;top:8%;width:110px;height:110px;border-radius:50%;background:#fff1b2;box-shadow:0 0 60px #fff1b266}.city{position:absolute;left:0;right:0;bottom:90px;height:250px;background:repeating-linear-gradient(90deg,#0d1631 0 90px,#18264a 90px 155px,#101b38 155px 250px)}.road{position:absolute;left:0;right:0;bottom:0;height:90px;background:#111829}.player{position:absolute;left:6%;bottom:72px;z-index:5;font-size:86px}.gate{position:absolute;right:13%;bottom:90px;width:95px;height:145px;border:9px solid #763f91;border-bottom:0;border-radius:45px 45px 0 0;background:#240e35cc;box-shadow:0 0 25px #d381ff88}.gate:after{content:'🔒';position:absolute;left:24px;top:50px;font-size:34px}.crystal{position:absolute;right:7%;bottom:170px;font-size:46px;filter:drop-shadow(0 0 12px #8be9ff);animation:f 1s ease-in-out infinite alternate}@keyframes f{to{transform:translateY(-12px)}}.hint{position:absolute;left:50%;top:7%;transform:translateX(-50%);padding:10px 15px;border-radius:999px;background:#090d25dd;font-weight:800;text-align:center}.controls{position:absolute;left:15px;right:15px;bottom:12px;display:flex;justify-content:space-between;z-index:20}.pad{display:flex;gap:10px}.ctrl{width:64px;height:56px;border:1px solid #ffffff30;border-radius:18px;background:#0c1230dd;color:#fff;font-size:1.4rem;font-weight:900}.ui{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:#07091bbb}.card{width:min(700px,94%);padding:25px;text-align:center;background:#fffaf5;color:#30223a}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#fff;border:2px solid #ecc0d5;color:#30223a}.choice.correct{background:#dcf8e6;border-color:#59c882}.choice.wrong{background:#ffe0e7;border-color:#ed7087}.hidden{display:none!important}.hero{position:absolute;bottom:85px;font-size:92px;z-index:8}.kitty{left:8%}.spidey{right:8%}.heart{position:absolute;left:50%;bottom:260px;transform:translateX(-50%);font-size:70px;opacity:0}.letter{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);opacity:0;pointer-events:none}.letter.show{opacity:1;pointer-events:auto}@media(max-width:650px){.panel{padding:26px}.stage{min-height:620px}.player,.hero{font-size:70px}.ctrl{width:60px;height:54px}.gate{transform:scale(.85);right:8%}}
</style></head><body><div id="root"></div><script>
(()=>{'use strict';const root=document.getElementById('root');const Q=[['Hum pehli baar kis date ko mile the?',['24 December','25 December','26 December','28 December'],2],['Hamari story mein sabse pehle kya hua?',['Numbers exchange','Pehli call','Hum pehli baar mile','Dating start'],2],['Humne numbers kis date ko exchange kiye?',['3 March','5 March','6 March','8 March'],1],['Hamari pehli call kis month mein hui?',['August','September','October','November'],1],['Pehli call mein tu aur didi kya kar rahe the?',['Plan bana rahe the','Lecture de rahe the','Prank kar rahe the','Gaana record'],2],['Hum officially dating kis date ko start hue?',['11 December','12 December','13 December','14 December'],2],['Sahi order kya hai?',['Call → numbers → dating','Numbers → meeting → dating','Meeting → numbers → call → dating','Dating → call → numbers'],2],['Deer Park mein tune kya bola tha?',['Should I?','Shirt','Sure?','Shh'],1],['Countdown kya tha?',['5…4…3…GO','3…2…1…GO','1…2…3…GO','Ready…set…GO'],1],['Tune kaunsa gaana bheja tha?',['Lag Ja Gale','Pehla Nasha','Buddha Mil Gaya','Pal Pal Dil Ke Paas'],2]];const S={q:0,l:3,c:0,score:0,x:6,open:false,keys:{},loop:null};function intro(){root.innerHTML=`<main class="app"><section class="screen"><div class="panel"><h1 class="title"><span>Hello Kitty</span><br>to the Rescue</h1><p class="lead">Tu Hello Kitty ko khud chala kar har memory gate cross karegi aur Spider-Man tak pahuchegi.</p><div class="duo"><div class="char">🎀🐱</div><div style="font-size:45px">💗</div><div class="char">🕷️</div></div><button class="cta" id="go">Story shuru kar</button></div></section></main>`;go.onclick=level}function level(){clearInterval(S.loop);S.x=6;S.open=false;root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="hud"><span>Yaad ${S.q+1}/10 · Score ${S.score}</span><span>💎 ${S.c}/10 · ${'❤️'.repeat(S.l)}</span></div><div class="stage" id="stage"><div class="moon"></div><div class="city"></div><div class="road"></div><div class="hint">Gate tak jaa 😌</div><div class="player" id="p">🎀🐱</div><div class="gate" id="gate"></div><div class="crystal hidden" id="crystal">💎</div><div class="controls"><div class="pad"><button class="ctrl" id="left">⬅️</button><button class="ctrl" id="right">➡️</button></div><button class="ctrl" id="act">✨</button></div></div></div></section></main>`;bind();S.loop=setInterval(step,16)}function bind(){const set=(k,v)=>S.keys[k]=v;onkeydown=e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)){e.preventDefault();set(e.key,true)}};onkeyup=e=>set(e.key,false);[['left','ArrowLeft'],['right','ArrowRight']].forEach(([id,k])=>{const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();set(k,true)};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>set(k,false)});act.onclick=quiz}function step(){const p=document.getElementById('p');if(!p)return;let d=0;if(S.keys.ArrowLeft||S.keys.a||S.keys.A)d=-.45;if(S.keys.ArrowRight||S.keys.d||S.keys.D)d=.45;S.x=Math.max(2,Math.min(S.open?88:67,S.x+d));p.style.left=S.x+'%';if(!S.open&&S.x>=65)quiz();if(S.open&&S.x>=84)collect()}function quiz(){if(S.open||document.getElementById('quiz'))return;clearInterval(S.loop);const [q,o,a]=Q[S.q],u=document.createElement('div');u.className='ui';u.id='quiz';u.innerHTML=`<div class="card"><h2>${q}</h2><div class="choices">${o.map((v,i)=>`<button class="choice" data-i="${i}">${v}</button>`).join('')}</div></div>`;stage.appendChild(u);u.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i,a,b))}function answer(i,a,b){if(i===a){b.classList.add('correct');S.score+=100;setTimeout(()=>{quiz.remove();S.open=true;gate.style.display='none';crystal.classList.remove('hidden');document.querySelector('.hint').textContent='Ab crystal collect kar 💎';S.loop=setInterval(step,16)},400)}else{b.classList.add('wrong');S.l=Math.max(1,S.l-1);setTimeout(()=>{quiz.remove();S.loop=setInterval(step,16)},650)}}function collect(){clearInterval(S.loop);S.c++;const u=document.createElement('div');u.className='ui';u.innerHTML=`<div class="card"><div style="font-size:3rem">💎✨</div><h2>Yaad wapas aa gayi</h2><p>Tune ek aur memory bacha li.</p><button class="cta" id="next">${S.q===9?'Ab mujhe bacha le':'Agli yaad'}</button></div>`;stage.appendChild(u);next.onclick=()=>{S.q++;S.q>=10?finale():level()}}function finale(){root.innerHTML=`<main class="app"><section class="screen"><div class="mission"><div class="stage" id="final"><div class="moon"></div><div class="city"></div><div class="road"></div><div class="hint">Tune saari yaadein wapas laa di 💗</div><div class="hero kitty" id="k">🎀🐱</div><div class="hero spidey" id="s">🕷️</div><div class="heart" id="h">💗</div><button class="cta letter" id="letter">Birthday letter khol 💌</button></div></div></section></main>`;k.animate([{left:'8%'},{left:'43%'}],{duration:1400,fill:'forwards'});s.animate([{right:'8%'},{right:'43%'}],{duration:1400,fill:'forwards'});setTimeout(()=>h.animate([{opacity:0,transform:'translateX(-50%) scale(.2)'},{opacity:1,transform:'translateX(-50%) scale(1.5)'},{opacity:0,transform:'translateX(-50%) translateY(-80px)'}],{duration:1300,fill:'forwards'}),1500);setTimeout(()=>letter.classList.add('show'),2700);letter.onclick=()=>{const u=document.createElement('div');u.className='ui';u.innerHTML=`<div class="card"><h2>Spider-Man bach gaya. Aur meri hero tu nikli. 💗</h2><p>Happy birthday, Pihu. Yeh chhoti si duniya sirf tere liye banayi hai.</p><button class="cta" id="again">Phir se khel</button></div>`;final.appendChild(u);again.onclick=()=>{Object.assign(S,{q:0,l:3,c:0,score:0,x:6,open:false});intro()}}}intro()})();
</script></body></html>
